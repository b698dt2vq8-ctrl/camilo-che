<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dos rostros de una Revolución | Camilo y Che en el servicio turístico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --olivo:#3B4A2F;
    --olivo-osc:#2B3722;
    --negro:#111111;
    --rojo:#B3202A;
    --crema:#F4EBD9;
    --dorado:#C9A227;
    --verde-ok:#3F7D3A;
    --titulos:'Oswald','Impact','Arial Narrow',sans-serif;
    --texto:'Lora','Georgia','Times New Roman',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--texto);
    color:var(--crema);
    background:
      repeating-linear-gradient(45deg,rgba(0,0,0,.05) 0 2px,transparent 2px 6px),
      var(--olivo);
    min-height:100vh;
    line-height:1.6;
    font-size:1.05rem;
  }
  h1,h2,h3{font-family:var(--titulos);font-weight:700;line-height:1.05;letter-spacing:.01em}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--dorado);outline-offset:3px}

/* Barra superior */
.barra{
position:sticky;top:0;z-index:10;
display:flex;align-items:center;justify-content:space-between;gap:1rem;
padding:.6rem 1.2rem;
background:var(--negro);
border-bottom:3px solid var(--rojo);
}
.marca{display:flex;align-items:center;gap:.6rem;font-family:var(--titulos);font-size:1.1rem}
.marca svg{width:22px;height:22px;fill:var(--rojo)}
.menu{display:flex;gap:.3rem;flex-wrap:wrap}
.menu button{
background:none;border:0;color:var(--crema);
padding:.4rem .75rem;border-radius:4px;font-family:var(--titulos);font-size:.95rem;
}
.menu button:hover{background:rgba(244,235,217,.12)}
.menu button[aria-current=“true”]{background:var(--rojo)}

main{max-width:1080px;margin:0 auto;padding:2rem 1.2rem 3rem}
.pantalla{display:none}
.pantalla.activa{display:block}

.btn{
display:inline-block;background:var(--rojo);color:var(--crema);
border:2px solid var(--crema);padding:.8rem 1.8rem;
font-family:var(--titulos);font-size:1.25rem;border-radius:3px;
transition:transform .15s, background .15s;
}
.btn:hover{background:#9a1a23;transform:translateY(-2px)}
.btn.claro{background:var(--crema);color:var(--negro);border-color:var(--crema)}
.btn.claro:hover{background:#fff}

/* Portada */
.portada{text-align:center;padding-top:1rem}
.portada h1{font-size:clamp(2.8rem,9vw,6rem);text-transform:uppercase;margin-bottom:.4rem}
.portada h1 span{display:block;color:var(--dorado)}
.subtitulo{max-width:34rem;margin:0 auto 1.5rem;font-style:italic;opacity:.92}
.escena{
display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:.5rem;
max-width:720px;margin:1.5rem auto;
}
.escena figure{position:relative}
.escena svg.sil{width:100%;height:auto;display:block}
.hueco{
width:100%;aspect-ratio:4/5;
display:flex;align-items:flex-end;justify-content:center;
border:4px solid var(--crema);box-shadow:6px 6px 0 var(--negro);
background:var(--olivo-osc);overflow:hidden;
}
.hueco svg,.hueco img{width:100%;height:100%;display:block}
.hueco img{object-fit:cover;object-position:center top;filter:grayscale(1) sepia(.3) hue-rotate(40deg)}
.escena figcaption{
font-family:var(--titulos);font-size:1.3rem;margin-top:.3rem;
}
.escena .estrella{width:clamp(40px,8vw,80px);fill:var(--rojo);align-self:center;filter:drop-shadow(0 0 0 var(--crema))}
.frases{display:grid;grid-template-columns:1fr 1fr;gap:1rem;max-width:720px;margin:0 auto 2rem;font-style:italic}
.frases p{border-top:2px solid var(--dorado);padding-top:.5rem}

/* Títulos de sección */
.titulo-seccion{font-size:clamp(2rem,5vw,3rem);text-transform:uppercase;margin-bottom:.4rem}
.intro{max-width:40rem;margin-bottom:1.8rem;opacity:.92}

/* Tarjetas de héroes */
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem}
.tarjeta{
background:var(--crema);color:var(--negro);
border:3px solid var(--negro);
box-shadow:6px 6px 0 var(--negro);
}
.tarjeta header{display:flex;gap:1rem;align-items:center;padding:1rem;border-bottom:3px solid var(--negro)}
.foto{
width:96px;height:120px;flex:none;background:var(--olivo);
border:2px solid var(--negro);overflow:hidden;
display:flex;align-items:flex-end;justify-content:center;
}
.foto img{width:100%;height:100%;object-fit:cover;object-position:center top;filter:grayscale(1) sepia(.35) hue-rotate(40deg)}
.foto svg{width:100%;height:100%}
.tarjeta h3{font-size:1.8rem}
.tarjeta .dato{font-size:.95rem;opacity:.8}
.cuerpo{padding:1rem}
.cuerpo p{margin-bottom:.8rem}
.etiquetas{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.8rem}
.etiquetas span{
background:var(--olivo);color:var(--crema);padding:.15rem .6rem;border-radius:99px;font-size:.9rem;
}
.toggle{
width:100%;background:var(--negro);color:var(--crema);border:0;
padding:.7rem;font-family:var(--titulos);font-size:1.05rem;
}
.toggle:hover{background:var(--rojo)}
.hitos{display:none;padding:0 1rem 1rem;border-top:2px dashed var(--olivo);margin-top:.2rem}
.hitos.abierto{display:block}
.hitos ul{list-style:none;margin-top:.8rem;border-left:3px solid var(--rojo);padding-left:.9rem}
.hitos li{margin-bottom:.6rem}
.hitos b{font-family:var(--titulos);color:var(--rojo);margin-right:.4rem}

.heroes{align-items:start}
.hitos h4{font-family:var(--titulos);font-size:1.15rem;color:var(--rojo);margin:1.1rem 0 .4rem}
.hitos p{margin-bottom:.7rem}
.hitos blockquote{border-left:4px solid var(--dorado);background:rgba(201,162,39,.15);padding:.7rem .9rem}
.hitos blockquote strong{display:block;font-size:1.1rem;margin-bottom:.3rem}
.hitos blockquote span{font-size:.95rem;opacity:.85}
.hitos .leccion{background:var(--olivo);color:var(--crema);padding:.8rem .9rem;border-radius:3px}
.etapa{font-family:var(--titulos);color:var(--dorado);margin-bottom:.8rem;font-size:1.1rem}
.refuerzo{max-width:34rem;margin:1rem auto 0;text-align:left;background:var(--crema);color:var(--negro);border:3px solid var(--negro);padding:.9rem 1.1rem}
.refuerzo ul{padding-left:1.2rem;margin-top:.3rem}

/* Comparativa */
.comparativa{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:1rem}
.col{background:var(--crema);color:var(--negro);padding:1.2rem;border:3px solid var(--negro)}
.col.centro{background:var(--rojo);color:var(--crema)}
.col h3{font-size:1.6rem;margin-bottom:.6rem}
.col ul{padding-left:1.1rem}
.col li{margin-bottom:.4rem}
.nota{margin-top:1.5rem;padding:1rem 1.2rem;border-left:5px solid var(--dorado);background:rgba(0,0,0,.25);max-width:46rem}

/* Reto */
.reto{max-width:720px;margin:0 auto}
.progreso{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem;font-family:var(--titulos)}
.barra-prog{flex:1;height:10px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden}
.barra-prog div{height:100%;background:var(--dorado);width:0;transition:width .4s}
.caso{background:var(--crema);color:var(--negro);border:3px solid var(--negro);box-shadow:6px 6px 0 var(--negro);padding:1.3rem}
.caso h3{font-size:1.5rem;margin-bottom:.5rem}
.opciones{display:grid;gap:.7rem;margin:1.2rem 0 .4rem}
.opcion{
text-align:left;background:#fff;color:var(--negro);
border:2px solid var(--negro);padding:.8rem 1rem;border-radius:3px;
transition:background .15s;
}
.opcion:hover:not(:disabled){background:#efe3c8}
.opcion:disabled{cursor:default}
.opcion.p2{background:var(--verde-ok);color:#fff}
.opcion.p1{background:var(--dorado)}
.opcion.p0{background:var(--rojo);color:#fff}
.opcion.mejor{outline:4px solid var(--verde-ok);outline-offset:2px}
.retro{
margin-top:1rem;padding:1rem;border:2px solid var(--negro);background:#fff;
display:none;gap:.9rem;align-items:flex-start;
}
.retro.visible{display:flex}
.insignia{
flex:none;width:52px;height:52px;border-radius:50%;
background:var(--olivo);color:var(--crema);border:3px solid var(--negro);
display:flex;align-items:center;justify-content:center;
font-family:var(--titulos);font-size:1.5rem;
}
.retro strong{font-family:var(--titulos);font-size:1.15rem;display:block}
.acciones{margin-top:1.2rem;text-align:right}

/* Resultado */
.resultado{max-width:720px;margin:0 auto;text-align:center}
.resultado .medalla{
width:130px;height:130px;margin:0 auto 1rem;border-radius:50%;
background:var(--crema);border:6px solid var(--dorado);
display:flex;align-items:center;justify-content:center;
}
.resultado .medalla svg{width:70px;height:70px;fill:var(--rojo)}
.resultado h2{font-size:clamp(2rem,6vw,3.2rem);text-transform:uppercase;margin-bottom:.5rem}
.marcador{display:flex;justify-content:center;gap:1rem;margin:1.2rem 0;flex-wrap:wrap}
.marcador div{background:var(--crema);color:var(--negro);border:3px solid var(--negro);padding:.7rem 1.4rem;min-width:140px}
.marcador b{display:block;font-family:var(--titulos);font-size:2rem;color:var(--rojo)}
.resultado .btn{margin:.4rem}

footer{
text-align:center;padding:1.5rem 1.2rem 2rem;border-top:3px solid var(--rojo);
background:var(--negro);font-style:italic;
}
footer small{display:block;margin-top:.5rem;font-style:normal;opacity:.7;font-size:.85rem}

@media (max-width:760px){
.comparativa{grid-template-columns:1fr}
.frases{grid-template-columns:1fr}
.acciones{text-align:center}
.acciones .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){
*{transition:none!important;scroll-behavior:auto!important}
}

/* ===== Idioma, quiz y mapa ===== */
.menu .idioma{background:var(--crema);color:var(--negro);font-weight:700;margin-left:.3rem}
.menu .idioma:hover{background:#fff}
.cita{border-left:4px solid var(--dorado);background:rgba(201,162,39,.18);padding:.8rem 1rem;font-size:1.2rem;font-style:italic;margin:.6rem 0}
.quien{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:1.2rem 0 .4rem}
.quien .opcion{text-align:center;font-family:var(--titulos);font-size:1.2rem}
.quien .opcion.mejor{outline:4px solid var(--verde-ok);outline-offset:2px}
.opcion.bien{background:var(--verde-ok);color:#fff}
.opcion.mal{background:var(--rojo);color:#fff}
.mapa-wrap{background:var(--olivo-osc);border:3px solid var(--negro);padding:.5rem;box-shadow:6px 6px 0 var(--negro)}
.mapa-wrap svg{width:100%;height:auto;display:block}
.pais{fill:#5b6f49;stroke:var(--crema);stroke-width:1.6;stroke-linejoin:round}
.ruta{fill:none;stroke-width:3;stroke-dasharray:7 6;stroke-linecap:round}
.ruta.comun{stroke:var(--crema)}
.ruta.r-camilo{stroke:var(--dorado)}
.ruta.r-che{stroke:#e0535c}
.punto{cursor:pointer}
.punto:focus-visible{outline:none}
.punto:focus-visible .vis{stroke:var(--crema);stroke-width:4}
.punto .vis{stroke:var(--negro);stroke-width:3}
.punto.sel .vis{stroke:var(--crema);stroke-width:4}
.c-camilo{fill:var(--dorado)}
.c-che{fill:var(--rojo)}
.c-ambos{fill:var(--crema)}
.etiqueta-mapa{font-family:var(--titulos);font-size:17px;fill:var(--crema);stroke:var(--negro);stroke-width:4;paint-order:stroke;text-anchor:middle;pointer-events:none}
.leyenda{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;margin:.9rem 0;font-size:.95rem}
.leyenda span{display:inline-flex;align-items:center;gap:.4rem}
.leyenda i{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--negro)}
.leyenda i.l-ruta{width:26px;height:0;border:0;border-top:3px dashed var(--crema);border-radius:0}
.leyenda i.l-ruta.rc{border-top-color:var(--dorado)}
.leyenda i.l-ruta.rch{border-top-color:#e0535c}
.lista-lugares{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.lugar{background:var(--crema);color:var(--negro);border:2px solid var(--negro);padding:.35rem .8rem;border-radius:99px;font-size:.95rem}
.lugar:hover{background:#fff}
.lugar[aria-pressed=“true”]{background:var(--rojo);color:var(--crema)}
.info-lugar{background:var(--crema);color:var(--negro);border:3px solid var(--negro);box-shadow:6px 6px 0 var(--negro);padding:1.1rem 1.2rem}
.info-lugar h3{font-size:1.6rem;margin-bottom:.2rem}
.info-lugar .quien-tag{display:inline-block;background:var(--olivo);color:var(--crema);padding:.1rem .7rem;border-radius:99px;font-size:.9rem;margin-bottom:.6rem}
.nota-mapa{margin-top:.8rem;font-size:.9rem;opacity:.8;font-style:italic}
@media (max-width:520px){
.quien{grid-template-columns:1fr}
.menu button{padding:.35rem .5rem;font-size:.85rem}
}
</style>

</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="estrella" viewBox="0 0 24 24"><path d="M12 1.5l3.1 7.2 7.8.7-5.9 5.2 1.8 7.6L12 18.1 5.2 22.2 7 14.6 1.1 9.4l7.8-.7z"/></symbol>
</svg>

<nav class="barra" aria-label="Navegación principal">
  <div class="marca"><svg><use href="#estrella"/></svg>Camilo y Che</div>
  <div class="menu" id="menu">
    <button data-ir="portada" data-i18n="nav_inicio"></button>
    <button data-ir="heroes" data-i18n="nav_heroes"></button>
    <button data-ir="comparativa" data-i18n="nav_comp"></button>
    <button data-ir="reto" data-i18n="nav_reto"></button>
    <button data-ir="quiz" data-i18n="nav_quiz"></button>
    <button data-ir="mapa" data-i18n="nav_mapa"></button>
    <button class="idioma" id="btn-idioma" data-i18n="lang_btn"></button>
  </div>
</nav>

<main>

  <!-- PORTADA -->

  <section id="portada" class="pantalla activa portada" aria-labelledby="t-portada">
    <h1 id="t-portada" data-i18n="h1"></h1>
    <p class="subtitulo" data-i18n="sub"></p>


<div class="escena" aria-hidden="true">
  <figure>
    <!-- ESPACIO CAMILO: pega aquí dentro el código <svg>...</svg> del busto (hombros hacia arriba) -->
    <div class="hueco" id="hueco-camilo"><img src="./images/foto-camilo.jpg" alt="Camilo Cienfuegos"></div>
    <figcaption>Camilo</figcaption>
  </figure>
  <svg class="estrella"><use href="#estrella"/></svg>
  <figure>
    <!-- ESPACIO CHE: pega aquí dentro el código <svg>...</svg> del busto (hombros hacia arriba) -->
    <div class="hueco" id="hueco-che"><img src="./images/foto-che.jpg" alt="Ernesto Che Guevara"></div>
    <figcaption>Che</figcaption>
  </figure>
</div>

<div class="frases">
  <p data-i18n="fr_camilo"></p>
  <p data-i18n="fr_che"></p>
</div>

<button class="btn" data-ir="heroes" data-i18n="comenzar"></button>


  </section>

  <!-- HÉROES -->

  <section id="heroes" class="pantalla" aria-labelledby="t-heroes">
    <h2 id="t-heroes" class="titulo-seccion" data-i18n="heroes_t"></h2>
    <p class="intro" data-i18n="heroes_i"></p>
    <div class="heroes" id="lista-heroes"></div>
  </section>

  <!-- COMPARATIVA -->

  <section id="comparativa" class="pantalla" aria-labelledby="t-comp">
    <h2 id="t-comp" class="titulo-seccion" data-i18n="comp_t"></h2>
    <p class="intro" data-i18n="comp_i"></p>
    <div class="comparativa">
      <div class="col">
        <h3>Camilo</h3>
        <ul data-i18n="comp_camilo"></ul>
      </div>
      <div class="col centro">
        <h3 data-i18n="comp_comun_t"></h3>
        <ul data-i18n="comp_comun"></ul>
      </div>
      <div class="col">
        <h3>Che</h3>
        <ul data-i18n="comp_che"></ul>
      </div>
    </div>
    <p class="nota" data-i18n="comp_nota"></p>
    <p style="margin-top:1.5rem"><button class="btn" data-ir="reto" data-i18n="comp_btn"></button></p>
  </section>

  <!-- RETO -->

  <section id="reto" class="pantalla" aria-labelledby="t-reto">
    <div class="reto" id="zona-reto"></div>
  </section>

  <!-- RESULTADO DEL RETO -->

  <section id="resultado" class="pantalla" aria-labelledby="t-res">
    <div class="resultado" id="zona-resultado"></div>
  </section>

  <!-- ¿QUIÉN FUE? -->

  <section id="quiz" class="pantalla" aria-labelledby="t-quiz">
    <div class="reto" id="zona-quiz"></div>
  </section>

  <section id="quizfin" class="pantalla" aria-labelledby="t-quizfin">
    <div class="resultado" id="zona-quizfin"></div>
  </section>

  <!-- MAPA -->

  <section id="mapa" class="pantalla" aria-labelledby="t-mapa">
    <h2 id="t-mapa" class="titulo-seccion" data-i18n="mapa_t"></h2>
    <p class="intro" data-i18n="mapa_i"></p>
    <div id="zona-mapa"></div>
  </section>

</main>

<footer>
  <span data-i18n="foot"></span>
  <small data-i18n="foot_small"></small>
  <small data-i18n="foot_autor"></small>
</footer>

<script>
let lang = 'es';
const t = p => p[lang === 'es' ? 0 : 1];
const L = (es, en) => lang === 'es' ? es : en;

/* ============================================================
   TEXTOS DE LA INTERFAZ  [español, inglés]
   ============================================================ */
const UI = {
  titulo: ['Dos rostros de una Revolución | Camilo y Che en el servicio turístico', 'Two Faces of One Revolution | Camilo and Che in tourism service'],
  aria_idioma: ['Cambiar a inglés', 'Switch to Spanish'],
  lang_btn: ['EN', 'ES'],
  nav_inicio: ['Inicio', 'Home'],
  nav_heroes: ['Los héroes', 'The heroes'],
  nav_comp: ['Comparativa', 'Compare'],
  nav_reto: ['Reto del servicio', 'Service challenge'],
  nav_quiz: ['¿Quién fue?', 'Who was it?'],
  nav_mapa: ['Mapa', 'Map'],

  sub: ['La vigencia del espíritu revolucionario en el servicio turístico.', 'The enduring revolutionary spirit in tourism service.'],
  fr_camilo: ['«Vas bien, Fidel.»<br>Camilo Cienfuegos', '“You’re doing fine, Fidel.”<br>Camilo Cienfuegos'],
  fr_che: ['«Hasta la victoria siempre.»<br>Ernesto Che Guevara', '“Until victory, always.”<br>Ernesto Che Guevara'],
  comenzar: ['Comenzar', 'Start'],
  heroes_t: ['Conoce a los héroes', 'Meet the heroes'],

  comp_t: ['Lo que los distingue y lo que los une', 'What sets them apart and what unites them'],
  comp_i: ['Camilo y Che tuvieron caminos distintos, pero compartieron los valores que hoy guían a un buen profesional del turismo.',

  comp_camilo: ['<li>Cercanía con el pueblo</li><li>Humor y sencillez</li><li>Liderazgo al frente de la tropa</li><li>Humanismo en el trato</li>',
                '<li>Closeness to the people</li><li>Humor and simplicity</li><li>Leading from the front</li><li>Humanism in how he treated others</li>'],
  comp_comun_t: ['Valores en común', 'Shared values'],
  comp_comun: ['<li>Humildad</li><li>Entrega total a la causa</li><li>Lealtad</li><li>Ejemplo personal</li><li>Servir con dignidad</li>',

  comp_btn: ['Ir al reto del servicio', 'Go to the service challenge'],

    const x = PX(l.lon).toFixed(1), y = PY(l.lat).toFixed(1);

  }).join('');

  const lugar = LUGARES.find(l => l.id === lugarSel);

  zona.querySelectorAll('[data-lugar]').forEach(el => {
    const elegir = () => { lugarSel = el.dataset.lugar; pintarMapa(); };

}

const estado = { actual:0, puntos:{camilo:0, che:0}, respuestas:[], respondido:false, eleccion:null, enCurso:false };

function iniciarReto(){
  estado.actual = 0;
  estado.puntos = {camilo:0, che:0};
  estado.respuestas = [];
  estado.respondido = false;
  estado.eleccion = null;
  estado.enCurso = true;
  pintarCaso();
}

function pintarCaso(){
  const c = CASOS[estado.actual];
  const total = CASOS.length;
  const zona = document.getElementById('zona-reto');
  zona.innerHTML = `
    <div class="progreso">
      <span>${estado.actual + 1} ${L('de', 'of')} ${total}</span>
      <div class="barra-prog" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${estado.actual}"><div style="width:${(estado.actual/total)*100}%"></div></div>
    </div>
    <p class="etapa">${L('Etapa', 'Stage')} ${c.etapa + 1} ${L('de', 'of')} ${ETAPAS.length}: ${t(ETAPAS[c.etapa])}</p>
    <div class="caso">
      <h2 id="t-reto" style="font-size:1rem;opacity:.7;font-family:var(--texto);font-weight:400;margin-bottom:.3rem">${L('Reto del servicio', 'Service challenge')}</h2>
      <h3>${t(c.titulo)}</h3>
      <p>${t(c.texto)}</p>
      <div class="opciones" id="opciones">
        ${c.opciones.map((o, i) => `<button class="opcion" data-i="${i}">${t(o[0])}</button>`).join('')}
      </div>
      <div class="retro" id="retro" role="status" aria-live="polite"></div>
    </div>
    <div class="acciones" id="acciones"></div>`;

  zona.querySelectorAll('.opcion').forEach(b => b.addEventListener('click', () => responder(+b.dataset.i)));
  if (estado.respondido) pintarRespuesta();
}

function responder(i){
  if (estado.respondido) return;
  const c = CASOS[estado.actual];
  const pts = c.opciones[i][1];
  estado.respondido = true;
  estado.eleccion = i;
  estado.puntos[c.heroe] += pts;
  estado.respuestas.push({ valor: c.valor, pts });
  pintarRespuesta();
  document.getElementById('siguiente').focus();
}

function pintarRespuesta(){
  const c = CASOS[estado.actual];
  const i = estado.eleccion;
  const pts = c.opciones[i][1];

  document.querySelectorAll('#opciones .opcion').forEach((b, idx) => {
    b.disabled = true;
    if (idx === i) b.classList.add('p' + c.opciones[idx][1]);
    if (c.opciones[idx][1] === 2) b.classList.add('mejor');
  });

  const veredicto = pts === 2 ? L('Excelente decisión', 'Excellent decision')
                  : pts === 1 ? L('Aceptable, pero se puede mejorar', 'Acceptable, but it can be improved')
                  : L('Esta no era la mejor opción', 'This was not the best option');
  const puntos = L(pts === 1 ? 'punto' : 'puntos', pts === 1 ? 'point' : 'points');
  const retro = document.getElementById('retro');
  retro.innerHTML = `
    <div class="insignia" aria-hidden="true">${c.heroe === 'camilo' ? 'C' : 'Ch'}</div>
    <div>
      <strong>${veredicto} (${pts} ${puntos})</strong>
      <span>${L('Valor en juego', 'Value at stake')}: ${t(c.valor)}. ${t(c.retro)}</span>
    </div>`;
  retro.classList.add('visible');

  const ultimo = estado.actual === CASOS.length - 1;
  document.getElementById('acciones').innerHTML =
    `<button class="btn" id="siguiente">${ultimo ? L('Ver mi resultado', 'See my result') : L('Siguiente situación', 'Next situation')}</button>`;
  document.getElementById('siguiente').addEventListener('click', () => {
    if (ultimo){ mostrarResultado(true); }
    else { estado.actual++; estado.respondido = false; estado.eleccion = null; pintarCaso(); window.scrollTo({top:0}); }
  });
}

function mostrarResultado(navegar){
  estado.enCurso = false;
  const { camilo, che } = estado.puntos;
  const total = camilo + che;
  const maxTotal = POR_HEROE * 2;
  const perfectas = estado.respuestas.filter(r => r.pts === 2).length;
  const reforzar = estado.respuestas.filter(r => r.pts < 2).map(r => t(r.valor));

  let titulo, mensaje;
  if (camilo > che){
    titulo = L('Tu espíritu se parece al de Camilo', 'Your spirit resembles Camilo’s');
    mensaje = L('Tu estilo es la cercanía y el liderazgo humano. Sirves con sencillez, alegría y siempre al lado de los demás.',
                'Your style is closeness and human leadership. You serve with simplicity, joy and always alongside others.');
  } else if (che > camilo){
    titulo = L('Tu espíritu se parece al del Che', 'Your spirit resembles Che’s');
    mensaje = L('Tu estilo es la ética y el ejemplo personal. Haces lo correcto aunque nadie te vea y no pides a otros lo que no harías tú.',
                'Your style is ethics and personal example. You do the right thing even when no one is watching and never ask of others what you wouldn’t do yourself.');
  } else {
    titulo = L('Eres un servicio completo', 'You are a complete service');
    mensaje = L('Camilo y Che en uno: tienes la cercanía humana y la firmeza ética que hacen grande a un profesional del turismo.',
                'Camilo and Che in one: you have the human closeness and ethical firmness that make a tourism professional great.');
  }
  const ratio = total / maxTotal;
  const cierre = ratio >= 0.8 ? L('Gran resultado: llevas la historia en cada servicio.', 'Great result: you carry history in every service.')
               : ratio >= 0.5 ? L('Buen camino: sigue practicando estos valores cada día.', 'Good path: keep practicing these values every day.')
               : L('Todavía hay mucho por aprender de ellos: vuelve a los héroes y repite el reto.', 'There is still much to learn from them: go back to the heroes and repeat the challenge.');

  document.getElementById('zona-resultado').innerHTML = `
    <div class="medalla"><svg aria-hidden="true"><use href="#estrella"/></svg></div>
    <h2 id="t-res">${titulo}</h2>
    <p>${mensaje}</p>
    <div class="marcador">
      <div><b>${camilo}/${POR_HEROE}</b>Camilo</div>
      <div><b>${che}/${POR_HEROE}</b>Che</div>
      <div><b>${total}/${maxTotal}</b>Total</div>
    </div>
    <p>${L('Tomaste la mejor decisión en', 'You made the best decision in')} <strong>${perfectas} ${L('de', 'of')} ${CASOS.length}</strong> ${L('situaciones', 'situations')}. ${cierre}</p>
    ${reforzar.length
      ? `<div class="refuerzo"><strong>${L('Valores para reforzar', 'Values to strengthen')}</strong><ul>${reforzar.map(v => `<li>${v}</li>`).join('')}</ul></div>`
      : `<div class="refuerzo"><strong>${L('No tienes nada que reforzar:', 'Nothing to strengthen:')}</strong> ${L('todas tus decisiones fueron las mejores.', 'all your decisions were the best ones.')}</div>`}
    <p style="margin-top:1rem">
      <button class="btn" id="repetir">${L('Repetir el reto', 'Repeat the challenge')}</button>
      <button class="btn claro" data-ir="heroes">${L('Ver los héroes', 'See the heroes')}</button>
    </p>`;
  document.getElementById('repetir').addEventListener('click', () => { iniciarReto(); ir('reto'); });
  if (navegar) ir('resultado');
}

const qs = { orden:[], actual:0, puntos:0, respondido:false, eleccion:null, enCurso:false };

function mezclar(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function iniciarQuiz(){
  qs.orden = mezclar(QUIZ.map((_, i) => i));
  qs.actual = 0;
  qs.puntos = 0;
  qs.respondido = false;
  qs.eleccion = null;
  qs.enCurso = true;
  pintarPregunta();
}

const NOMBRE_RESP = { camilo: ['Camilo', 'Camilo'], che: ['Che', 'Che'], ambos: ['Los dos', 'Both'] };

    </div>
    <div class="caso">
      <h2 id="t-quiz" style="font-size:1rem;opacity:.7;font-family:var(--texto);font-weight:400;margin-bottom:.3rem">${L('¿Quién fue?', 'Who was it?')}</h2>
      <h3>${q.tipo === 'frase' ? L('¿Quién lo dijo?', 'Who said it?') : L('¿De quién se trata?', 'Who is it about?')}</h3>
      ${q.tipo === 'frase' ? `<p class="cita">${t(q.texto)}</p>` : `<p style="font-size:1.15rem">${t(q.texto)}</p>`}
      <div class="quien" id="opciones">
        ${['camilo', 'che', 'ambos'].map(k => `<button class="opcion" data-k="${k}">${t(NOMBRE_RESP[k])}</button>`).join('')}
      </div>
      <div class="retro" id="retro" role="status" aria-live="polite"></div>
    </div>
    <div class="acciones" id="acciones"></div>`;
  zona.querySelectorAll('.opcion').forEach(b => b.addEventListener('click', () => responderQuiz(b.dataset.k)));
  if (qs.respondido) pintarRespuestaQuiz();
}

function responderQuiz(k){
  if (qs.respondido) return;
  const q = QUIZ[qs.orden[qs.actual]];
  qs.respondido = true;
  qs.eleccion = k;
  if (k === q.resp) qs.puntos++;
  pintarRespuestaQuiz();
  document.getElementById('siguiente').focus();
}

function pintarRespuestaQuiz(){
  const q = QUIZ[qs.orden[qs.actual]];
  const ok = qs.eleccion === q.resp;
  document.querySelectorAll('#opciones .opcion').forEach(b => {
    b.disabled = true;
    if (b.dataset.k === q.resp) b.classList.add('mejor');
    if (b.dataset.k === qs.eleccion) b.classList.add(ok ? 'bien' : 'mal');
  });
  const retro = document.getElementById('retro');
  retro.innerHTML = `
    <div class="insignia" aria-hidden="true">${ok ? '✓' : '✗'}</div>
    <div>
      <strong>${ok ? L('¡Correcto!', 'Correct!') : L('No es esa.', 'Not quite.')}${ok ? '' : ' ' + L('Respuesta: ', 'Answer: ') + t(NOMBRE_RESP[q.resp]) + '.'}</strong>
      <span>${t(q.retro)}</span>
    </div>`;
  retro.classList.add('visible');

  const ultimo = qs.actual === QUIZ.length - 1;
  document.getElementById('acciones').innerHTML =
    `<button class="btn" id="siguiente">${ultimo ? L('Ver mi resultado', 'See my result') : L('Siguiente', 'Next')}</button>`;
  document.getElementById('siguiente').addEventListener('click', () => {
    if (ultimo){ mostrarResultadoQuiz(true); }
    else { qs.actual++; qs.respondido = false; qs.eleccion = null; pintarPregunta(); window.scrollTo({top:0}); }
  });
}

function mostrarResultadoQuiz(navegar){
  qs.enCurso = false;
  const total = QUIZ.length;
  const ratio = qs.puntos / total;
  const titulo = ratio >= 0.85 ? L('¡Conoces bien a Camilo y al Che!', 'You know Camilo and Che well!')
               : ratio >= 0.5 ? L('Vas por buen camino', 'You’re on the right track')
               : L('Aún puedes aprender más de ellos', 'You can still learn more about them');
  const msg = ratio >= 0.85 ? L('Tu memoria histórica está a la altura del concurso.', 'Your historical memory is up to the contest.')
            : ratio >= 0.5 ? L('Repasa las tarjetas de los héroes y el mapa, y vuelve a intentarlo.', 'Review the hero cards and the map, then try again.')
            : L('Visita la sección de los héroes y vuelve a jugar: aprenderás mucho.', 'Visit the heroes section and play again: you will learn a lot.');
  document.getElementById('zona-quizfin').innerHTML = `
    <div class="medalla"><svg aria-hidden="true"><use href="#estrella"/></svg></div>
    <h2 id="t-quizfin">${titulo}</h2>
    <div class="marcador"><div><b>${qs.puntos}/${total}</b>${L('Aciertos', 'Correct answers')}</div></div>
    <p>${msg}</p>
    <p style="margin-top:1rem">
      <button class="btn" id="repetir-quiz">${L('Jugar de nuevo', 'Play again')}</button>
      <button class="btn claro" data-ir="mapa">${L('Ver el mapa', 'See the map')}</button>
    </p>`;
  document.getElementById('repetir-quiz').addEventListener('click', () => { iniciarQuiz(); ir('quiz'); });
  if (navegar) ir('quizfin');
}

/* Inicio */
aplicarIdioma();
pintarHeroes();
pintarMapa();
ir('portada');
</script>
</body>
</html>
